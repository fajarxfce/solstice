name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 02:00 UTC daily, for the property sweep.
    - cron: "0 2 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  msrv:
    # The declared `rust-version` compiled by the compiler it names.
    #
    # This job exists because the claim was wrong the moment it was written:
    # the workspace said 1.80 while `indexmap` alone needed 1.85, and nothing
    # would have noticed — the development toolchain is far newer, so the only
    # person who would ever have found out is someone else, mid-build, reading
    # an error about a dependency they had never heard of.
    #
    # An MSRV nobody compiles is not a floor, it is a rumour.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  sweep:
    # The delta law at depth, nightly.
    #
    # Plan §6 asks for thousands of cases per commit and millions overnight,
    # and the two halves are not the same test: the per-commit run finds
    # anything shallow, while the shapes that actually break incremental
    # maintenance — a re-key racing a refill, a window emptied and refilled in
    # one pump — need a lot of draws before proptest builds one. Running this
    # on a schedule rather than per-PR keeps that depth affordable.
    #
    # A failure here prints its seed; paste it into `PROPTEST_CASES=1` with the
    # regression file to replay it exactly.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Delta law sweep
        env:
          PROPTEST_CASES: "1000000"
        run: cargo test --release -p solstice-ivm --test delta_law

      # An order of magnitude shallower, because every case here compiles a
      # statement and runs it against SQLite. Still deep enough to reach the
      # cases that found the `substr` NULL and the blob round trip, which the
      # per-commit 256 did not.
      - name: SQLite oracle sweep
        env:
          PROPTEST_CASES: "100000"
        run: cargo test --release -p solstice-store --test oracle

  bench:
    # The M0 harness, run small.
    #
    # Deliberately *not* a performance gate. A shared GitHub runner's timings
    # are noise, and plan §9 puts the real gate on a physical Android device;
    # asserting a millisecond budget here would only teach people to re-run red
    # builds until they go green.
    #
    # What it does protect is real. The harness is what stands between the kill
    # criteria and nobody noticing, so it must keep compiling and keep being
    # runnable end to end. And every phase ends in `verify` — plan §6's second
    # oracle — which re-asks SQLite the same question and fails the run if the
    # incrementally maintained view has drifted. Two thousand transactions of
    # that, on every push, is a correctness test the property suite cannot
    # express: it is about drift over a long run on realistic data, not about a
    # single delta obeying the law.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Harness end to end at tiny scale
        run: >
          cargo run --release -p solstice-bench --
          --scale tiny --project 1 --k 20 --txns 2000

  abi:
    # The wire format, checked by a decoder nobody here wrote.
    #
    # `solstice-proto`'s encoder is hand-written, so its own tests are a closed
    # loop: they prove the encoder agrees with the decoder sitting next to it,
    # which is exactly what a matched pair of bugs would also do. The check that
    # means something is code `protoc` generated from the normative `.proto`,
    # in another language, reading bytes Rust produced.
    #
    # Which only counts if it runs somewhere other than the author's laptop.
    #
    # Note what is *not* gated: the 5ms budget. The Dart decode fails it today
    # (see spikes/s1-decode/README.md) and a shared runner's timings could not
    # adjudicate that anyway — plan §9 puts the real gate on a physical device.
    # What fails this job is the cross-check assertion: a drift between the
    # encoder and the spec.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: dart-lang/setup-dart@v1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: dart pub global activate protoc_plugin

      # Not a synthetic payload: a real hydration through real SQLite, so the
      # row shapes that drive the decode cost come from the engine.
      - name: Generate the fixture
        run: cargo run --release -p solstice-bench --bin s1-fixture

      - name: Generate the decoders from the normative .proto
        run: ./spikes/s1-decode/generate.sh

      - name: Rust encoder vs. generated Dart decoder
        run: ./spikes/s1-decode/dart/run.sh

      # Two oracles again, and deliberately different ones. Against the 1000-row
      # view the accessor is checked field by field on every row against the
      # generated decoder; against `edge.bin` it is checked against what Rust
      # encoded, because on the extremes of `i64` the generated decoder is the
      # one that is wrong.
      - name: Zero-copy accessor vs. both
        run: ./spikes/s1-decode/dart/run.sh lazy

  determinism:
    # Five lines of grep protecting the one property everything else rests on.
    #
    # `solstice-ivm` must contain no ambient nondeterminism: no clock, no RNG, no
    # threads, no IO, and no dependence on `HashMap` iteration order. Every such
    # dependency is injected through `OpCx` instead.
    #
    # Without this, determinism erodes one innocuous `Instant::now()` at a time,
    # and the deterministic simulation tests — the only tool that can find the
    # convergence bugs this project is most likely to ship — stop working. It is
    # far cheaper to enforce than to restore.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject ambient nondeterminism in solstice-ivm
        run: |
          set -uo pipefail
          banned='std::time|SystemTime|Instant::now|use rand|rand::|thread::spawn|std::fs|std::net|HashMap<|HashMap::|collections::HashMap'
          # Doc comments name these types when explaining why they are banned,
          # so strip comment lines before matching.
          hits=$(grep -rnE "$banned" crates/solstice-ivm/src \
                 | grep -vE '^[^:]+:[0-9]+: *(//|/\*|\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo "::error::solstice-ivm must stay deterministic. Inject clocks, randomness"
            echo "and IO through OpCx; use IndexMap or BTreeMap instead of HashMap."
            exit 1
          fi
          echo "solstice-ivm is clean."
